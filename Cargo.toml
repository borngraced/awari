[workspace]
resolver = "2"
members = [
    "crates/awari",
    "crates/awari-compositor",
    "crates/awari-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/borngraced/reelshell"

[workspace.dependencies]
niri-ipc = "=26.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# Build GPUI from the local patched tree: `scripts/setup-gpui.sh` seeds zed
# at our pinned rev into .third_party/zed and applies
# patches/gpui-set-visible.patch, which adds Window::set_visible(bool) for
# layer-shell surfaces (unmap without renderer teardown — how the launcher
# hides while keeping reopen to a single frame). Upstream has no equivalent
# yet; see gpui-ce PR #87. The block below is managed by the script.
# BEGIN-GPUI-PATCH (managed by scripts/setup-gpui.sh)
[patch."https://github.com/zed-industries/zed"]
gpui = { version = "=0.2.2", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_platform = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_linux = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_wgpu = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_macros = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_apple = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_macos = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_web = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_windows = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
collections = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_shared_string = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
gpui_util = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
sum_tree = { version = "=0.1.0", git = "file:///home/borngraced/dev/reelshell/.third_party/zed", rev = "5ce345047e57c8620e753c57412458a035e1a47c" }
# END-GPUI-PATCH

[profile.release]
lto = true
codegen-units = 8
strip = true
