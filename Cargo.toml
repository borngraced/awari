[workspace]
resolver = "2"
members = [
    "crates/awari",
    "crates/awari-compositor",
    "crates/awari-ipc",
]
exclude = [".third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/borngraced/awari"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

# GPUI is built from the vendored, patched zed tree under .third_party/zed.
# The only local change is patches/gpui-set-visible.patch, which adds
# Window::set_keyboard_interactivity for layer-shell surfaces (the launcher
# takes Exclusive focus while open, None when dismissed). Upstream has no
# equivalent yet; see gpui-ce PR #87. The patched tree is committed directly.
# Vendored, patched zed GPUI committed under .third_party/zed (see
# patches/gpui-set-visible.patch for the only local change: it adds
# Window::set_keyboard_interactivity for layer-shell). The patched tree is
# committed directly, so a fresh clone builds with no separate remote.
[patch."https://github.com/zed-industries/zed"]
gpui = { version = "=0.2.2", path = ".third_party/zed/crates/gpui" }
gpui_platform = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_platform" }
gpui_linux = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_linux" }
gpui_wgpu = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_wgpu" }
gpui_macros = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_macros" }
gpui_apple = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_apple" }
gpui_macos = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_macos" }
gpui_web = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_web" }
gpui_windows = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_windows" }
collections = { version = "=0.1.0", path = ".third_party/zed/crates/collections" }
gpui_shared_string = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_shared_string" }
gpui_util = { version = "=0.1.0", path = ".third_party/zed/crates/gpui_util" }
sum_tree = { version = "=0.1.0", path = ".third_party/zed/crates/sum_tree" }

[profile.release]
opt-level = 3       # Optimize for runtime speed; launcher latency matters more than binary size
lto = true          # Link-Time Optimization (removes dead code across crates)
codegen-units = 1   # Reduces parallel compilation to maximize LTO optimization
strip = true        # Automatically strips symbols and debug info
panic = "abort"     # Removes stack unwinding plumbing (saves significant space)
